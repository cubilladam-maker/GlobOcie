<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#060814" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
<title>Odkryj swój wewnętrzny ukryty kod — quiz AI</title>
  <link rel="stylesheet" href="styles.css?v=2.19" />
</head>
<body data-screen="start">
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-action="home" aria-label="Strona główna" data-i18n-aria="homeAria">
        <span class="brand-mark"><i></i></span>
        <span>
          <strong data-i18n="brandName">Odkryj swój ukryty kod</strong>
          <small data-i18n="brandTagline">quiz wspierany przez sztuczną inteligencję</small>
        </span>
      </button>
      <nav>
        <button class="ghost" data-action="help" data-i18n="help">ⓘ Jak to działa?</button>
        <button class="ghost" data-action="privacy" data-i18n="privacy">♢ Prywatność</button>
        <div class="language-switch" role="group" aria-label="Wybór języka" data-i18n-aria="languageGroupAria">
          <span data-i18n="languageLabel">Język</span>
          <button type="button" data-language="pl" aria-pressed="true">PL</button>
          <button type="button" data-language="en" aria-pressed="false">EN</button>
        </div>
        <div class="top-progress" id="top-progress" hidden></div>
      </nav>
      <button class="owner-hotspot" id="owner-hotspot" aria-label="Otwórz statystyki właściciela" data-i18n-aria="ownerHotspot"></button>
      <output class="owner-counter" id="owner-counter" hidden></output>
    </header>

    <main id="app" aria-live="polite"></main>

    <footer>
      <span data-i18n="footerBrand">Odkryj swój ukryty kod</span>
      <span class="site-version" id="site-version" aria-label="Wersja strony v2.19" data-i18n="siteVersion" data-i18n-aria="siteVersionAria">Wersja strony: v2.19</span>
      <span data-i18n="footerService">Brak Service Workera buforującego stary interfejs.</span>
    </footer>
  </div>

  <dialog id="info-dialog">
    <button class="dialog-close" data-action="close-dialog" aria-label="Zamknij" data-i18n-aria="closeDialog">×</button>
    <div id="dialog-content"></div>
  </dialog>

  <dialog id="confirm-dialog">
    <div id="confirm-content"></div>
  </dialog>

  <script src="themes.js?v=2.19" defer></script>
  <script src="i18n.js?v=2.19" defer></script>
  <script src="visitor-counter-config.js?v=2.19" defer></script>
  <script src="topics/polityka-pl.quiz.gz.js?v=2.19" defer></script>
  <script src="topics/religia-swiatopoglad-pl.quiz.gz.js?v=2.19" defer></script>
  <script src="topics/global-warming-pl.quiz.gz.js?v=2.19" defer></script>
  <script src="app.js?v=2.19" defer></script>
</body>
</html>
