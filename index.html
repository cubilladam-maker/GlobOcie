<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070d1c" />
  <title>Kim naprawdę jestem — Sztuczna Inteligencja</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="male">
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-action="home" aria-label="Strona główna">
        <span class="brand-mark">◉</span>
        <span>
          <strong>Kim naprawdę jestem</strong>
          <small>quiz wspierany przez sztuczną inteligencję</small>
        </span>
      </button>
      <nav>
        <button class="ghost" data-action="help">Jak to działa?</button>
        <button class="ghost" data-action="privacy">Prywatność</button>
      </nav>
    </header>

    <main id="app" aria-live="polite"></main>

    <footer>
      <span>Wersja prototypowa 0.1.6</span>
      <span>Tematy quizów są ładowane ze skompresowanych paczek.</span>
    </footer>
  </div>

  <dialog id="info-dialog">
    <button class="dialog-close" data-action="close-dialog" aria-label="Zamknij">×</button>
    <div id="dialog-content"></div>
  </dialog>

  <script src="topics/polityka-pl.quiz.gz.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
